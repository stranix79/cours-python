# Configuration pytest du labo (convention des labos 12 à 21, voir chapitre 12).
#   pytest              → les tests de ce dossier contre TON squelette
#   SOLUTION=1 pytest   → les mêmes tests contre solution/ (voir conftest.py)
[pytest]
addopts = --import-mode=importlib
pythonpath = .
norecursedirs = solution
