# pyproject.toml — Labo 21 (solution) : le projet statusboard.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "statusboard"
version = "0.1.0"
description = "Surveillance de cibles HTTP/TCP/ping avec API FastAPI, SSE et CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
statusboard = "statusboard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/statusboard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]     # B008 : Depends() en défaut d'argument, c'est l'idiome FastAPI

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "strict"
