# .github/workflows/ci.yml — Labo 20 (solution) : intégration continue.
#
# GitHub ne lit ce fichier que s'il est à la racine du dépôt (.github/ du repo) :
# ici c'est un modèle à copier. À chaque push ou pull request, trois jobs en
# parallèle (un par version de Python) lancent lint, format, typage et tests.
name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                 # une version qui casse n'arrête pas les autres
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installer le projet et ses outils de dev
        run: pip install -e ".[dev]"
      - name: Lint et format
        run: |
          ruff check .
          ruff format --check .
      - name: Typage
        run: mypy
      - name: Tests
        run: pytest
      - name: Construire la wheel
        run: python -m build
